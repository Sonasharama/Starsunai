<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StarSunAI - AI Image</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6fa;
    color:#171717;
}

.header{
    height:115px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid #ddd;
}

.logo{
    font-size:40px;
    font-weight:800;
    color:#6d28d9;
}

.logo span{
    color:#111827;
}

.profile{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#6d28d9;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
}

.nav{
    background:#111827;
    height:78px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 15px;
    overflow-x:auto;
    white-space:nowrap;
}

.nav a{
    text-decoration:none;
    color:#e5e7eb;
    padding:17px 20px;
    border-radius:15px;
    font-size:20px;
}

.nav a.active{
    background:#6d28d9;
    color:white;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:35px 25px 60px;
}

.back{
    display:inline-block;
    text-decoration:none;
    color:#6d28d9;
    font-size:18px;
    font-weight:bold;
    margin-bottom:25px;
}

.title{
    font-size:42px;
    font-weight:800;
    margin-bottom:10px;
}

.subtitle{
    color:#6b7280;
    font-size:20px;
    line-height:1.5;
    margin-bottom:30px;
}

.card{
    background:#fff;
    border:1px solid #e2e2e2;
    border-radius:22px;
    padding:28px;
    box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

label{
    display:block;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

textarea{
    width:100%;
    min-height:180px;
    resize:vertical;
    border:1px solid #d1d5db;
    border-radius:15px;
    padding:18px;
    font-size:17px;
    outline:none;
    font-family:Arial,Helvetica,sans-serif;
}

textarea:focus{
    border-color:#6d28d9;
    box-shadow:0 0 0 3px rgba(109,40,217,0.12);
}

.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    margin-top:25px;
}

.option{
    border:1px solid #ddd;
    border-radius:15px;
    padding:18px;
}

select{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    background:#fff;
}

.generate{
    width:100%;
    margin-top:25px;
    border:none;
    background:#6d28d9;
    color:#fff;
    padding:18px;
    border-radius:15px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.generate:hover{
    background:#5b21b6;
}

.result{
    margin-top:25px;
    background:#f9fafb;
    border:2px dashed #d1d5db;
    border-radius:18px;
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#6b7280;
    padding:25px;
}

@media(max-width:700px){

    .header{
        height:100px;
        padding:0 20px;
    }

    .logo{
        font-size:30px;
    }

    .profile{
        width:50px;
        height:50px;
        font-size:20px;
    }

    .nav{
        height:70px;
    }

    .nav a{
        font-size:17px;
        padding:14px 16px;
    }

    .container{
        padding:25px 18px 50px;
    }

    .title{
        font-size:32px;
    }

    .subtitle{
        font-size:18px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .card{
        padding:20px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        StarSun<span>AI</span>
    </div>

    <div class="profile">
        S
    </div>

</header>

<nav class="nav">

    <a href="index.html">
        🏠 Dashboard
    </a>

    <a href="image.html" class="active">
        🖼️ AI Image
    </a>

    <a href="video.html">
        🎬 AI Video
    </a>

    <a href="story.html">
        ✍️ AI Story
    </a>

    <a href="voice.html">
        🎙️ AI Voice
    </a>

    <a href="character.html">
        👤 Character
    </a>

    <a href="background.html">
        🌄 Background
    </a>

</nav>

<main class="container">

    <a href="index.html" class="back">
        ← Dashboard पर वापस जाएँ
    </a>

    <h1 class="title">
        🖼️ AI Image Creator
    </h1>

    <p class="subtitle">
        अपने विचार को एक शानदार AI Image में बदलें।
    </p>

    <section class="card">

        <label for="prompt">
            Image Prompt
        </label>

        <textarea
            id="prompt"
            placeholder="उदाहरण: एक भारतीय गाँव में सूर्यास्त के समय खेत में खड़ा किसान, cinematic lighting, ultra realistic..."
        ></textarea>

        <div class="options">

            <div class="option">

                <label>
                    Image Style
                </label>

                <select id="style">

                    <option>Realistic</option>
                    <option>Ultra Realistic</option>
                    <option>Cinematic</option>
                    <option>Digital Art</option>
                    <option>Anime</option>
                    <option>3D</option>

                </select>

            </div>

            <div class="option">

                <label>
                    Aspect Ratio
                </label>

                <select id="ratio">

                    <option>1:1</option>
                    <option>16:9</option>
                    <option>9:16</option>
                    <option>4:5</option>

                </select>

            </div>

        </div>

        <button class="generate" onclick="generateImage()">
            ✨ Generate Image
        </button>

        <div class="result" id="result">

            <div>
                <div style="font-size:45px;">🖼️</div>
                <br>
                आपकी AI Image यहाँ दिखाई देगी
            </div>

        </div>

    </section>

</main>

<script>

function generateImage(){

    const prompt =
        document.getElementById("prompt").value.trim();

    const style =
        document.getElementById("style").value;

    const ratio =
        document.getElementById("ratio").value;

    const result =
        document.getElementById("result");

    if(!prompt){

        result.innerHTML = `
            <div>
                <div style="font-size:40px;">⚠️</div>
                <br>
                पहले Image Prompt लिखिए।
            </div>
        `;

        return;
    }

    result.innerHTML = `
        <div>
            <div style="font-size:45px;">⏳</div>
            <br>
            <strong>Image तैयार की जा रही है...</strong>
            <br><br>
            Style: ${style}<br>
            Ratio: ${ratio}
            <br><br>
            <small>
                AI Image API जोड़ने के बाद यहाँ वास्तविक image generate होगी।
            </small>
        </div>
    `;
}

</script>

</body>
</html>
