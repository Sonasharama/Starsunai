<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StarSunAI - AI Voice</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6fa;
    color:#171717;
}

/* HEADER */
.header{
    height:115px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid #ddd;
}

.logo{
    font-size:40px;
    font-weight:800;
    color:#6d28d9;
}

.logo span{
    color:#111827;
}

.profile{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#6d28d9;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
}

/* NAVIGATION */
.nav{
    background:#111827;
    min-height:78px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 15px;
    overflow-x:auto;
    white-space:nowrap;
}

.nav a{
    text-decoration:none;
    color:#e5e7eb;
    padding:17px 20px;
    border-radius:15px;
    font-size:20px;
}

.nav a.active{
    background:#6d28d9;
    color:#fff;
}

/* MAIN */
.container{
    max-width:1100px;
    margin:auto;
    padding:35px 25px 60px;
}

.back{
    display:inline-block;
    text-decoration:none;
    color:#6d28d9;
    font-size:18px;
    font-weight:bold;
    margin-bottom:25px;
}

.title{
    font-size:42px;
    font-weight:800;
    margin-bottom:10px;
}

.subtitle{
    color:#6b7280;
    font-size:20px;
    line-height:1.5;
    margin-bottom:30px;
}

/* CARD */
.card{
    background:#fff;
    border:1px solid #e2e2e2;
    border-radius:22px;
    padding:28px;
    box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

label{
    display:block;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

textarea{
    width:100%;
    min-height:200px;
    resize:vertical;
    border:1px solid #d1d5db;
    border-radius:15px;
    padding:18px;
    font-size:17px;
    outline:none;
