<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarSunAI - AI Voice</title>
<style>
body{margin:0;font-family:Arial;background:#f5f6fa;color:#111}
header{background:#fff;padding:25px;font-size:32px;font-weight:bold;color:#6d28d9}
nav{background:#111827;padding:15px;overflow:auto;white-space:nowrap}
nav a{color:white;text-decoration:none;margin-right:18px}
main{max-width:900px;margin:30px auto;padding:20px}
.card{background:white;padding:25px;border-radius:20px}
textarea{width:100%;height:180px;padding:15px;font-size:16px;box-sizing:border-box}
button{margin-top:15px;width:100%;padding:15px;background:#6d28d9;color:white;border:0;border-radius:10px;font-size:18px}
</style>
</head>
<body>

<header>StarSunAI</header>

<nav>
<a href="index.html">Home</a>
<a href="image.html">AI Image</a>
<a href="video.html">AI Video</a>
<a href="story.html">AI Story</a>
<a href="voice.html">AI Voice</a>
</nav>

<main>
<div class="card">
<h1>🎙️ AI Voice Creator</h1>
<p>अपनी Script यहाँ लिखें</p>

<textarea id="text" placeholder="अपनी script लिखें..."></textarea>

<button onclick="makeVoice()">Generate Voice</button>

<p id="msg"></p>
</div>
</main>

<script>
function makeVoice(){
let t=document.getElementById("text").value;
if(!t){alert("पहले Script लिखें");return;}
document.getElementById("msg").innerText="Script तैयार है।";
}
</script>

</body>
</html>
